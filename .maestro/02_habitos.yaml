# Flujo E2E de la iteración 2: crear, validar, editar, archivar y desarchivar hábitos (C1–C5).
# Se ejecuta SOLO a demanda y después de validar con el equipo la ejecución y los escenarios.
#   maestro test .maestro/02_habitos.yaml
# Usa identificadores (no textos), así que funciona igual en español e inglés.
# Los botones del final del formulario se centran con `centerElement` antes de tocarlos: si quedan
# pegados al borde inferior, el toque cae en la barra de gestos del sistema.
# Los ids de las filas (habits_row_1, _2...) son los que asigna la base de datos en orden de creación.
appId: co.com.buildinghabittracker
name: "02 · Hábitos"
---
- runFlow: subflows/registrar_y_entrar.yaml
- tapOn: { id: "today_habits_button" }
- assertVisible: { id: "habits_empty_text" }

# Escenario 1 · C1 y C3: no se guarda sin título ni sin días
- tapOn: { id: "habits_add_button" }
- tapOn: { id: "form_all_days_button" }          # empieza con todos → los quita
- scrollUntilVisible: { element: { id: "form_save_button" }, centerElement: true }
- tapOn: { id: "form_save_button" }
- assertVisible: { id: "form_days_error" }
- scrollUntilVisible: { element: { id: "form_title_input" }, direction: UP }
- assertVisible: { id: "form_title_error" }

# Escenario 2 · Crear "Gym" lunes, miércoles y viernes (C1–C3)
- tapOn: { id: "form_title_input" }
- inputText: "Gym"
- hideKeyboard
- scrollUntilVisible: { element: { id: "form_day_monday" }, centerElement: true }
- tapOn: { id: "form_day_monday" }
- tapOn: { id: "form_day_wednesday" }
- tapOn: { id: "form_day_friday" }
- scrollUntilVisible: { element: { id: "form_save_button" }, centerElement: true }
- tapOn: { id: "form_save_button" }
- assertVisible: { id: "habits_row_1" }

# Escenario 3 · C1: título repetido entre activos (sin importar mayúsculas)
- tapOn: { id: "habits_add_button" }
- tapOn: { id: "form_title_input" }
- inputText: "gYM"
- hideKeyboard
- scrollUntilVisible: { element: { id: "form_save_button" }, centerElement: true }
- tapOn: { id: "form_save_button" }
- scrollUntilVisible: { element: { id: "form_title_input" }, direction: UP }
- assertVisible: { id: "form_title_error" }
- swipe: { start: "50%, 30%", end: "50%, 85%" }   # sube al inicio del formulario
- tapOn: { id: "form_back_button" }

# Escenario 4 · Editar: cambiar emoji y color
- tapOn: { id: "habits_row_1" }
- assertVisible: { id: "form_screen" }
- tapOn: { id: "form_emoji_3" }
- tapOn: { id: "form_color_2" }
- scrollUntilVisible: { element: { id: "form_save_button" }, centerElement: true }
- tapOn: { id: "form_save_button" }
- assertVisible: { id: "habits_row_1" }

# Escenario 5 · C5: archivar pide confirmación; cancelar no archiva
- tapOn: { id: "habits_row_1" }
- scrollUntilVisible: { element: { id: "form_archive_button" }, centerElement: true }
- tapOn: { id: "form_archive_button" }
- tapOn: { id: "form_archive_cancel_button" }
- assertVisible: { id: "form_screen" }
- tapOn: { id: "form_archive_button" }
- tapOn: { id: "form_archive_confirm_button" }
- assertVisible: { id: "habits_empty_text" }

# Escenario 6 · C1 al desarchivar: bloqueado si ya hay un "Gym" activo
- tapOn: { id: "habits_add_button" }
- tapOn: { id: "form_title_input" }
- inputText: "Gym"
- hideKeyboard
- scrollUntilVisible: { element: { id: "form_save_button" }, centerElement: true }
- tapOn: { id: "form_save_button" }
- assertVisible: { id: "habits_row_2" }
- tapOn: { id: "habits_tab_archived" }
- tapOn: { id: "habits_unarchive_1" }
- assertVisible: { id: "habits_unarchive_blocked_text" }
- assertVisible: { id: "habits_row_1" }               # sigue archivado

# Escenario 7 · Desarchivar cuando el título queda libre
- tapOn: { id: "habits_tab_active" }
- tapOn: { id: "habits_row_2" }
- tapOn: { id: "form_title_input" }
- eraseText: 10
- inputText: "Pesas"
- hideKeyboard
- scrollUntilVisible: { element: { id: "form_save_button" }, centerElement: true }
- tapOn: { id: "form_save_button" }
- tapOn: { id: "habits_tab_archived" }
- tapOn: { id: "habits_unarchive_1" }
- assertVisible: { id: "habits_row_1" }               # vuelve a la pestaña Activos
- assertVisible: { id: "habits_row_2" }

# Escenario 8 · Los hábitos siguen ahí al reabrir la app
- stopApp
- launchApp
- tapOn: { id: "pin_key_1" }
- tapOn: { id: "pin_key_3" }
- tapOn: { id: "pin_key_5" }
- tapOn: { id: "pin_key_7" }
- tapOn: { id: "today_habits_button" }
- assertVisible: { id: "habits_row_1" }
- assertVisible: { id: "habits_row_2" }
