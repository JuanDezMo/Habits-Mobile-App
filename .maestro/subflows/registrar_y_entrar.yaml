# Subflujo reutilizable: app limpia → registro de Ana con PIN 1357 → entra a Hoy.
# Lo usan los flujos de la iteración 2 en adelante con `runFlow`.
appId: co.com.buildinghabittracker
---
- launchApp:
    clearState: true
- tapOn: { id: "register_name_input" }
- inputText: "Ana"
- tapOn: { id: "register_email_input" }
- inputText: "ana@correo.com"
- hideKeyboard
- tapOn: { id: "register_continue_button" }
- repeat:
    times: 2
    commands:
      - tapOn: { id: "register_pin_key_1" }
      - tapOn: { id: "register_pin_key_3" }
      - tapOn: { id: "register_pin_key_5" }
      - tapOn: { id: "register_pin_key_7" }
- tapOn: { id: "register_question_input" }
- inputText: "Nombre de mi primera mascota"
- tapOn: { id: "register_answer_input" }
- inputText: "Firulais"
- hideKeyboard
- tapOn: { id: "register_finish_button" }
- tapOn: { id: "pin_key_1" }
- tapOn: { id: "pin_key_3" }
- tapOn: { id: "pin_key_5" }
- tapOn: { id: "pin_key_7" }
- assertVisible: { id: "today_screen" }
