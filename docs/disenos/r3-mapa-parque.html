<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Mapa de parque · Hoy</title>
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap" rel="stylesheet">
<style>
/* Mapa de parque: color plano sin degradados, un lóbulo domina la pantalla, controles en cápsulas */
:root{--water:#F5F1E4;--land:#8ED462;--ink:#2C2E2A;--yellow:#F5E211;--coral:#FF705D;--blue:#2BA0FF;--lilac:#EBC1FF}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:var(--water);font-family:"Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);position:relative}
/* el lóbulo verde: el progreso de hoy; su costa sale del cuadro por arriba y por la derecha */
.lobe{position:absolute;left:-40px;top:-60px;width:520px;height:420px}
.head{position:relative;padding:58px 22px 0}
.date{font-size:14px}
.hi{font-size:44px;line-height:.95;letter-spacing:-.05em;margin-top:6px}
.big{position:relative;margin:18px 22px 0;font-size:118px;line-height:.85;letter-spacing:-.06em}
.big small{font-size:46px;letter-spacing:-.03em}
.gate{position:relative;display:inline-block;margin:14px 22px 0;background:var(--yellow);border-radius:999px;padding:8px 16px;font-size:15px}
.list{position:absolute;left:0;right:0;top:400px;padding:0 18px;display:grid;gap:12px}
/* cada hábito es una cápsula; el chip redondo cruza al inicio cuando está hecho */
.cap{height:68px;border-radius:999px;display:flex;align-items:center;gap:12px;padding:0 10px 0 22px;font-size:20px;letter-spacing:-.03em;position:relative}
.cap .t{flex:1}
.cap .t small{display:block;font-size:13px;letter-spacing:0;opacity:.8}
.chip{width:50px;height:50px;border-radius:50%;background:var(--water);display:grid;place-items:center;font-size:24px}
.cap.done{padding:0 22px 0 10px}
.cap.done .chip{background:var(--ink);color:var(--water);font-size:22px}
.nav{position:absolute;left:12px;right:12px;bottom:18px;height:64px;background:var(--ink);border-radius:999px;display:flex;justify-content:space-around;align-items:center;color:var(--water);font-size:15px}
.nav .on{background:var(--yellow);color:var(--ink);border-radius:999px;padding:10px 18px}
</style></head><body>
<svg class="lobe" viewBox="0 0 520 420" aria-hidden="true"><path fill="#8ED462" d="M0 0H520V300C470 330 430 300 380 340C330 380 260 420 190 380C140 352 120 400 60 392C20 386 0 360 0 330Z"/>
  <!-- la "laguna": lo que falta hoy, el agua se asoma dentro del lóbulo -->
  <ellipse cx="400" cy="250" rx="44" ry="30" fill="#F5F1E4"/></svg>
<header class="head"><div class="date">jueves 14 de noviembre</div><div class="hi">Hola,<br>Ana</div></header>
<div class="big">2<small> de 3</small></div>
<div class="gate">Te falta Meditar</div>
<main class="list">
  <div class="cap done" style="background:var(--coral)"><div class="chip">✓</div><div class="t">🏋️ Gym<small>6 días seguidos</small></div></div>
  <div class="cap done" style="background:var(--blue)"><div class="chip">✓</div><div class="t">📖 Leer<small>31 días seguidos</small></div></div>
  <div class="cap" style="background:var(--lilac)"><div class="t">🧘 Meditar<small>toca hoy</small></div><div class="chip"></div></div>
</main>
<nav class="nav"><span class="on">Hoy</span><span>Hábitos</span><span>Ajustes</span></nav>
</body></html>
