<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Peso variable · Hoy</title>
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Peso variable: la racha se escribe con más peso cuantos más días lleva; el número ES el gráfico */
:root{--paper:#F6F6F3;--ink:#0D0D0D;--accent:#FF3D00;--muted:#7A7A74}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:var(--paper);font-family:"Roboto Flex",system-ui,sans-serif;color:var(--ink)}
.head{padding:56px 20px 0;display:flex;justify-content:space-between;align-items:baseline}
.date,.mono{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.04em}
.hero{padding:6px 16px 0;font-size:200px;line-height:.8;letter-spacing:-.05em;font-variation-settings:"wght" 900,"opsz" 144}
.hero small{font-size:60px;margin-left:8px;font-variation-settings:"wght" 200}
.cap{padding:8px 20px 0;font-size:18px;font-variation-settings:"wght" 600}
.cap b{color:var(--accent)}
.list{margin-top:22px;border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:96px 1fr 48px;align-items:center;padding:10px 20px;border-bottom:1px solid #DADAD4}
.n{font-size:56px;line-height:1;letter-spacing:-.04em}
.name{font-size:17px;font-variation-settings:"wght" 650}.name .mono{display:block;margin-top:3px}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:20px}
.chk.on{background:var(--ink);color:var(--paper)}
.chk.todo{border-color:var(--accent);box-shadow:0 0 0 4px #FF3D0022}
.nav{position:absolute;left:0;right:0;bottom:0;height:80px;display:flex;justify-content:space-around;padding-top:16px;border-top:2px solid var(--ink);font-size:13px;font-variation-settings:"wght" 700}
.nav .on{color:var(--accent)}
</style></head><body>
<header class="head"><span class="date">JUE 14 NOV</span><span class="date">HOLA, ANA</span></header>
<div class="hero">2<small>/3</small></div>
<div class="cap">hábitos hoy · <b>falta Meditar</b></div>
<main class="list">
  <div class="row"><div class="n" style="font-variation-settings:'wght' 380">6</div><div class="name">🏋️ Gym<span class="mono">wght 380 · 6 días</span></div><div class="chk on">✓</div></div>
  <div class="row"><div class="n" style="font-variation-settings:'wght' 1000">31</div><div class="name">📖 Leer<span class="mono">wght 1000 · 31 días</span></div><div class="chk on">✓</div></div>
  <div class="row"><div class="n" style="font-variation-settings:'wght' 100">0</div><div class="name">🧘 Meditar<span class="mono">wght 100 · empieza hoy</span></div><div class="chk todo"></div></div>
</main>
<nav class="nav"><span class="on">Hoy</span><span>Hábitos</span><span>Ajustes</span></nav>
</body></html>
