<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Grilla construida · Hoy</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Crouwel: grilla de construcción visible; el progreso de hoy se arma celda por celda */
:root{--ground:#FFFFFF;--ink:#101114;--muted:#6E737B;--grid:#E4ECF7;--accent:#1D4ED8}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:"Space Grotesk",system-ui,sans-serif;color:var(--ink);
  background:var(--ground) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 26px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/26px 100%}
.head{padding:56px 26px 0}
.date{font-size:13px;color:var(--muted);font-weight:500}
/* número monumental hecho de celdas */
.big{display:grid;grid-template-columns:repeat(9,26px);grid-auto-rows:26px;margin:18px 0 0 26px}
.big i{background:var(--accent)}
.cap{margin:10px 26px 0;font-weight:700;font-size:15px}
.list{margin-top:22px;background:#fff;border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:44px 1fr 44px;gap:12px;align-items:center;padding:12px 26px;border-bottom:1px solid var(--grid)}
.e{font-size:24px}
.name{font-weight:700;font-size:16px}
.cells{display:flex;gap:2px;margin-top:6px}
.cells b{width:12px;height:12px;background:var(--grid)}
.chk{width:44px;height:44px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;color:#fff}
.chk.on{background:var(--accent);border-color:var(--accent)}
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:#fff;border-top:2px solid var(--ink);display:flex;justify-content:space-around;padding-top:14px;font-size:12px;font-weight:700;color:var(--muted)}
.nav .on{color:var(--accent)}
</style></head><body>
<header class="head"><div class="date">Jueves 14 de noviembre · Hola, Ana</div></header>
<!-- "2/3" en celdas: 2 = columnas 0-2, barra = 4, 3 = 6-8 -->
<div class="big">
  <i style="grid-area:1/1/2/4"></i><i style="grid-area:2/3/3/4"></i><i style="grid-area:3/1/4/4"></i><i style="grid-area:4/1/5/2"></i><i style="grid-area:5/1/6/4"></i>
  <i style="grid-area:4/5/5/6;background:var(--ink)"></i><i style="grid-area:3/5/4/6;background:var(--ink);opacity:.0"></i><i style="grid-area:2/5/3/6;background:var(--ink)"></i>
  <i style="grid-area:1/7/2/10;background:var(--grid);outline:1px dashed var(--accent)"></i><i style="grid-area:2/9/3/10;background:var(--grid);outline:1px dashed var(--accent)"></i><i style="grid-area:3/7/4/10;background:var(--grid);outline:1px dashed var(--accent)"></i><i style="grid-area:4/9/5/10;background:var(--grid);outline:1px dashed var(--accent)"></i><i style="grid-area:5/7/6/10;background:var(--grid);outline:1px dashed var(--accent)"></i>
</div>
<div class="cap">2 de 3 hábitos hoy</div>
<main class="list">
  <div class="row"><div class="e">🏋️</div><div><div class="name">Gym · 6</div><div class="cells"><b style="background:var(--accent)"></b><b style="background:var(--accent)"></b><b style="background:var(--accent)"></b><b style="background:var(--accent)"></b><b style="background:var(--accent)"></b><b style="background:var(--accent)"></b></div></div><div class="chk on">✓</div></div>
  <div class="row"><div class="e">📖</div><div><div class="name">Leer · 31</div><div class="cells"><b style="background:var(--accent);width:120px"></b></div></div><div class="chk on">✓</div></div>
  <div class="row"><div class="e">🧘</div><div><div class="name">Meditar · 0</div><div class="cells"><b></b></div></div><div class="chk"></div></div>
</main>
<nav class="nav"><div class="on">Hoy</div><div>Hábitos</div><div>Ajustes</div></nav>
</body></html>
